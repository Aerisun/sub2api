@ROOT@/var/log/nginx-error.log @ROOT@/data/gateway-auth-rejections.log {
    daily
    maxsize 5M
    rotate 7
    maxage 7
    compress
    delaycompress
    missingok
    notifempty
    create 0600 @USER@ @GROUP@
    sharedscripts
    postrotate
        @ROOT@/runtime/bin/nginx -s reopen -c @ROOT@/deployment/private/config/nginx.conf -p @ROOT@/ -e @ROOT@/var/log/nginx-error.log
    endscript
}
