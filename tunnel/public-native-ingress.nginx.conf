# Prepared for the original public nginx host; not installed there yet.
# Keep the existing HTTPS listener, certificates and unrelated site locations.
# Place the map/upstream in http{}, then replace only its /sub2api/ location.

map $http_upgrade $sub2api_native_connection {
    default upgrade;
    '' '';
}

upstream sub2api_native_forward {
    # Existing restricted SSH reverse tunnel, remote loopback only.
    server 127.0.0.1:18081;
    keepalive 256;
}

# Inside the existing HTTPS server{}:
location /sub2api/ {
    # The trailing slash strips /sub2api/ before reaching the native gateway.
    proxy_pass http://sub2api_native_forward/;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto https;
    proxy_set_header X-Client-Request-ID $http_x_client_request_id;
    proxy_set_header Upgrade $http_upgrade;
    proxy_set_header Connection $sub2api_native_connection;
    proxy_connect_timeout 5s;
    proxy_read_timeout 3600s;
    proxy_send_timeout 3600s;
    proxy_buffering off;
    proxy_request_buffering off;
    client_max_body_size 256m;
}
