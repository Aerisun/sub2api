worker_processes 2;
worker_rlimit_nofile 65536;
pid @ROOT@/var/run/nginx.pid;
error_log @ROOT@/var/log/nginx-error.log warn;

events { worker_connections 4096; }

http {
    include @ROOT@/deployment/mime.types;
    default_type application/octet-stream;
    upstream gateway_backend {
        server 127.0.0.1:8080;
        keepalive 256;
        keepalive_requests 10000;
        keepalive_timeout 60s;
    }
    upstream agent_backend {
        server 127.0.0.1:8094;
        keepalive 256;
        keepalive_requests 10000;
        keepalive_timeout 10s;
    }
    upstream image_hub_backend {
        server 127.0.0.1:8092;
        keepalive 32;
        keepalive_requests 10000;
        keepalive_timeout 10s;
    }
    map $http_upgrade $gateway_connection {
        default upgrade;
        "" "";
    }
    # HTTP chat turns can execute private image tools. GET/WebSocket traffic
    # continues to use the native gateway directly.
    map $request_method $agent_chat_backend {
        default gateway_backend;
        POST agent_backend;
    }
    # Record credential categories on rejected API requests, never credential values.
    map $http_authorization $gateway_auth_kind {
        default other;
        "" missing;
        ~*^Bearer\s+sk-REPLACE_WITH_YOUR_API_KEY$ placeholder;
        ~*^Bearer\s+Bearer\s+ duplicated_bearer;
        ~*^Bearer\s+eyJ jwt;
        ~*^Bearer\s+sk-[A-Za-z0-9_-]+$ api_key_shape;
    }
    map $http_x_api_key $gateway_key_kind {
        default other;
        "" missing;
        sk-REPLACE_WITH_YOUR_API_KEY placeholder;
        ~^sk-[A-Za-z0-9_-]+$ api_key_shape;
    }
    map "$status:$uri" $log_gateway_rejection {
        default 0;
        ~^401:/v1/ 1;
    }
    log_format gateway_rejection escape=json '{"time":"$time_iso8601","path":"$uri","status":$status,"authorization_kind":"$gateway_auth_kind","api_key_kind":"$gateway_key_kind","user_agent":"$http_user_agent","client_request_id":"$http_x_client_request_id"}';
    access_log @ROOT@/data/gateway-auth-rejections.log gateway_rejection if=$log_gateway_rejection;
    # Trace only explicitly identified capacity probes; never log keys or bodies.
    map $http_x_client_request_id $log_capacity_latency {
        default 0;
        ~^capacity- 1;
    }
    log_format capacity_latency escape=json '{"time":"$time_iso8601","path":"$uri","client_request_id":"$http_x_client_request_id","host":"$host","remote_addr":"$remote_addr","status":$status,"request_time":"$request_time","upstream_connect_time":"$upstream_connect_time","upstream_header_time":"$upstream_header_time","upstream_response_time":"$upstream_response_time"}';
    access_log @ROOT@/data/capacity-ingress-latency.log capacity_latency if=$log_capacity_latency;
    sendfile on;
    # The web service runs as rowan, so request bodies need a writable private cache.
    client_body_temp_path @ROOT@/data/image-io/request-bodies 1 2;

    server {
        listen 127.0.0.1:8081;
        server_name localhost;
        root @ROOT@/var/www;
        index index.html;
        client_max_body_size 256m;

        # Request-owned in-memory images. The unguessable capability expires
        # with its model request; never log tokens or cache original pixels.
        location ^~ /_vision-assets/ {
            limit_except GET HEAD { deny all; }
            access_log off;
            error_log /dev/null crit;
            proxy_pass http://127.0.0.1:8096/v1/vision-assets/;
            proxy_http_version 1.1;
            proxy_set_header Connection close;
            proxy_buffering off;
            proxy_cache off;
            proxy_read_timeout 25s;
            proxy_send_timeout 25s;
        }

        # Reusable internal tools: standard HTTP and stateless Streamable MCP.
        location ~ ^/(?:v1/)?models/?$ {
            proxy_pass http://agent_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_buffering off;
        }
        location ~ ^/(?:v1/)?tools(?:/(?:mcp|call|web_search|image_generation|image_recognition))?$ {
            client_max_body_size 96m;
            proxy_pass http://agent_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header Connection "";
            proxy_buffering off;
            proxy_request_buffering on;
            proxy_read_timeout 190s;
        }

        location ~ ^/(?:(?:v1/)?(?:messages|chat/completions|responses)|antigravity/v1/messages)$ {
            rewrite ^/(messages|chat/completions|responses)$ /v1/$1 break;
            proxy_pass http://$agent_chat_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $gateway_connection;
            proxy_buffering off;
            proxy_pass_header X-Accel-Buffering;
            # The bridge requires Content-Length; buffer chunked/H2 bodies
            # here so SDKs without a known request length remain compatible.
            proxy_request_buffering on;
            proxy_read_timeout 3600s;
        }

        # All clients share the site base URL; unversioned SDK paths use
        # the same authenticated gateway, model routing and billing pipeline.
        location ~ ^/(models(?:/[^/]+)?|embeddings|rerank(?:ing)?|images/(?:generations|edits)|chat/completions|responses(?:/.*)?|messages(?:/count_tokens)?)$ {
            rewrite ^ /v1$uri break;
            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $gateway_connection;
            proxy_buffering off;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
        }

        # The image hub uses the same site API keys and gateway billing.
        location ~ ^/(?:v1/)?images/(?:generations/async|tasks/[^/]+)$ {
            rewrite ^/images/(.*)$ /v1/images/$1 break;
            proxy_pass http://image_hub_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 90s;
        }
        location ^~ /image-hub/ {
            proxy_pass http://image_hub_backend;
            proxy_http_version 1.1;
            proxy_set_header Connection "";
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_buffering off;
            proxy_read_timeout 90s;
        }

        location ~ ^/(api/|v1/|v1beta/|antigravity/|backend-api/|health$|setup/) {
            proxy_pass http://gateway_backend;
            proxy_http_version 1.1;
            proxy_set_header Host $host;
            proxy_set_header X-Real-IP $remote_addr;
            proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
            proxy_set_header X-Forwarded-Proto https;
            proxy_set_header Upgrade $http_upgrade;
            proxy_set_header Connection $gateway_connection;
            proxy_buffering off;
            proxy_pass_header X-Accel-Buffering;
            proxy_request_buffering off;
            proxy_read_timeout 3600s;
        }

        # Chat entry revalidates; hashed bundles are immutable and compressed.
        location = /chat-ui/index.html {
            add_header Cache-Control "no-cache" always;
        }
        location ^~ /chat-ui/assets/ {
            gzip on;
            gzip_types application/javascript text/css application/json image/svg+xml;
            gzip_vary on;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # Content-hashed console bundles are safe to reuse across navigation.
        # Keep missing chunks as a real 404 instead of returning the SPA entry.
        location ^~ /assets/ {
            gzip on;
            gzip_types application/javascript text/css application/json image/svg+xml;
            gzip_vary on;
            expires 1y;
            add_header Cache-Control "public, immutable";
            try_files $uri =404;
        }

        # SPA entry documents must revalidate instead of retaining old asset hashes.
        location = /index.html {
            add_header Cache-Control "no-cache, no-store, must-revalidate" always;
            expires -1;
        }

        location / {
            try_files $uri $uri/ /index.html;
        }
    }
}
